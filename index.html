<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>•••</title>
  <meta name="theme-color" content="#f7f4eb" />
  <style>
    :root {
      --bg-cream: #f7f4eb;
      --bg-card: rgba(255, 253, 248, 0.88);
      --bg-soft: #eef2e6;
      --matcha: #5e8c61;
      --matcha-light: #a3c999;
      --matcha-pale: rgba(163, 201, 153, 0.28);
      --terracotta: #861619;
      --cobalt: #3148d8;
      --honey: #e89b3c;
      --coral: #d96552;
      --text-main: #2d382e;
      --text-muted: #768475;
      --border: rgba(94, 140, 97, 0.18);
      --shadow: 0 8px 24px rgba(56, 74, 58, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(180deg, #faf8f2 0%, #f1ede0 100%);
      color: var(--text-main);
      font-family: ui-rounded, "SF Pro Rounded", "Quicksand", "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 12px 16px 16px;
      overflow-x: hidden;
      position: relative;
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    /* Subtle Hand-Drawn Background Scene (User Sketch) */
    .bg-doodle-scene {
      width: 92%;
      max-width: 350px;
      height: auto;
      max-height: 120px;
      object-fit: contain;
      margin-top: 4px;
      pointer-events: none;
      opacity: 0.85;
      transition: opacity 0.3s ease;
    }

    body.whistling-now .bg-doodle-scene {
      opacity: 1;
    }

    .whistle-notes {
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    body.whistling-now .whistle-notes {
      opacity: 1;
      animation: floatNotes 1.1s ease-in-out infinite alternate;
    }

    @keyframes floatNotes {
      from { transform: translate(0, 0); }
      to { transform: translate(4px, -5px); }
    }

    .app-shell {
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      position: relative;
      z-index: 10;
    }

    /* Compact Cute Lock + Hold Ring */
    .lock-stage {
      position: relative;
      width: 82px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      position: absolute;
      inset: 0;
      width: 82px;
      height: 82px;
      transform: rotate(-90deg);
      pointer-events: none;
    }

    .progress-ring-bg {
      fill: none;
      stroke: rgba(94, 140, 97, 0.14);
      stroke-width: 6.5;
    }

    .progress-ring-fill {
      fill: none;
      stroke: var(--matcha);
      stroke-width: 6.5;
      stroke-linecap: round;
      stroke-dasharray: 351.86;
      stroke-dashoffset: 351.86;
      transition: stroke 0.3s ease;
    }

    .lock-core {
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #fffdf8;
      border: 2px solid rgba(94, 140, 97, 0.25);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      z-index: 5;
    }

    .lock-core:active {
      transform: scale(0.94);
    }

    .lock-core.active-whistle {
      border-color: var(--matcha);
      box-shadow: 0 0 22px rgba(94, 140, 97, 0.35);
    }

    .lock-core.unlocked {
      border-color: var(--matcha);
      background: #f2f9f1;
    }

    .padlock-svg {
      width: 28px;
      height: 28px;
      overflow: visible;
    }

    .padlock-shackle {
      fill: none;
      stroke: var(--matcha);
      stroke-width: 4.5;
      stroke-linecap: round;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), stroke 0.4s ease;
      transform-origin: 34px 22px;
    }

    .lock-core.unlocked .padlock-shackle {
      transform: translateY(-8px) rotate(22deg);
    }

    .padlock-body {
      fill: var(--honey);
      transition: fill 0.4s ease;
    }

    .lock-core.unlocked .padlock-body {
      fill: var(--matcha);
    }

    .padlock-keyhole {
      fill: #fffdf8;
    }

    .hold-pct {
      font-size: 9.5px;
      font-weight: 800;
      color: var(--matcha);
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    /* Live Waveform + Spectrum Card */
    .scope-card {
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 8px;
      position: relative;
      box-shadow: var(--shadow);
    }

    #scope-canvas {
      width: 100%;
      height: 96px;
      display: block;
      border-radius: 13px;
      background: rgba(238, 242, 230, 0.55);
    }

    .scope-legend {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .scope-zone-tag {
      color: var(--matcha);
    }

    /* Coaching Pill */
    .status-pill {
      width: 100%;
      min-height: 36px;
      padding: 7px 14px;
      border-radius: 99px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    .status-pill.good {
      border-color: var(--matcha);
      background: #eef7ec;
      color: #2f5e33;
    }

    .status-pill.warn {
      border-color: rgba(217, 101, 82, 0.45);
      background: #fdf2f0;
      color: var(--coral);
    }

    /* Real-Time Pitch & Power Bars */
    .meters-stack {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .meter-card {
      background: var(--bg-card);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid var(--border);
      border-radius: 18px;
      padding: 9px 14px 11px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: var(--shadow);
    }

    .meter-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .meter-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zone-pill {
      font-size: 9.5px;
      padding: 1.5px 7px;
      border-radius: 99px;
      background: var(--matcha-pale);
      color: var(--matcha);
      font-weight: 800;
    }

    .meter-val {
      font-size: 13.5px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .meter-val.in-zone {
      color: var(--matcha);
    }

    .meter-track {
      position: relative;
      height: 13px;
      background: var(--bg-soft);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid rgba(94, 140, 97, 0.14);
    }

    .pitch-zone-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 30%;
      width: 45%;
      background: rgba(94, 140, 97, 0.2);
      border-left: 2px dashed var(--matcha);
      border-right: 2px dashed var(--matcha);
      z-index: 2;
      pointer-events: none;
    }

    .power-threshold-marker {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 84%;
      width: 2.5px;
      background: var(--honey);
      z-index: 3;
      pointer-events: none;
    }

    .meter-fill {
      position: relative;
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #94a896, #748c76);
      transition: width 0.04s linear, background 0.15s ease;
      z-index: 1;
    }

    .meter-fill.active {
      background: linear-gradient(90deg, var(--matcha), #82b879);
    }

    /* 4-Digit Combination Tumblers */
    .combination-box {
      width: 100%;
      background: var(--bg-card);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      box-shadow: var(--shadow);
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }

    .combination-box.unlocked {
      border-color: var(--matcha);
      box-shadow: 0 8px 28px rgba(94, 140, 97, 0.2);
    }

    .digits-row {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .digit-slot {
      width: 48px;
      height: 52px;
      border-radius: 14px;
      background: var(--bg-soft);
      border: 1.5px solid rgba(94, 140, 97, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .combination-box.unlocked .digit-slot {
      color: var(--matcha);
      border-color: var(--matcha);
      background: #eef7ec;
      transform: translateY(-2px);
    }

    .reveal-note {
      font-size: 13px;
      font-weight: 700;
      color: var(--matcha);
      text-align: center;
      line-height: 1.35;
      display: none;
    }

    .combination-box.unlocked .reveal-note {
      display: block;
    }

    /* Action Buttons */
    .actions-row {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    .btn-primary {
      flex: 1;
      height: 50px;
      border-radius: 16px;
      border: none;
      background: var(--matcha);
      color: #fffdf8;
      font-family: inherit;
      font-size: 15.5px;
      font-weight: 800;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(94, 140, 97, 0.28);
      transition: transform 0.12s ease, background 0.2s ease;
      touch-action: manipulation;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-primary.listening {
      background: #fffdf8;
      color: var(--matcha);
      border: 2px solid var(--matcha);
      box-shadow: none;
    }

    .btn-guide {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow);
      touch-action: manipulation;
    }

    .btn-guide:active {
      transform: scale(0.94);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(45, 56, 46, 0.45);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 50;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 420px;
      background: #fffdf8;
      border-top: 2px solid var(--border);
      border-radius: 26px 26px 0 0;
      padding: 20px 18px 28px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.08);
    }

    .modal-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .sheet-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--matcha);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sheet-close {
      background: var(--bg-soft);
      border: none;
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .steps-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .step-card {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 5px;
    }

    .step-num {
      font-size: 10px;
      font-weight: 800;
      color: var(--matcha);
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }

    .step-emoji {
      font-size: 26px;
      line-height: 1.1;
    }

    .step-title {
      font-size: 12.5px;
      font-weight: 800;
      color: var(--text-main);
    }

    .step-desc {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Calibration Drawer */
    .calib-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .calib-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .calib-row input {
      width: 110px;
      padding: 6px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--bg-soft);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      text-align: right;
      user-select: text;
      -webkit-user-select: text;
    }

    .calib-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-small {
      flex: 1;
      padding: 10px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg-soft);
      color: var(--text-main);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }

    .btn-small.amber {
      background: var(--matcha);
      color: #fffdf8;
      border: none;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>

  <main class="app-shell">
    <!-- Top Padlock + Hold Progress Ring -->
    <div class="lock-stage">
      <svg class="progress-ring" viewBox="0 0 124 124">
        <circle class="progress-ring-bg" cx="62" cy="62" r="56"></circle>
        <circle class="progress-ring-fill" id="progress-circle" cx="62" cy="62" r="56"></circle>
      </svg>

      <div class="lock-core" id="lock-core">
        <svg class="padlock-svg" viewBox="0 0 48 48">
          <path class="padlock-shackle" d="M14 22 V14 A10 10 0 0 1 34 14 V22" />
          <rect class="padlock-body" x="9" y="21" width="30" height="22" rx="7" />
          <circle class="padlock-keyhole" cx="24" cy="30" r="2.5" />
          <path class="padlock-keyhole" d="M23 31.5 L22.2 36.5 H25.8 L25 31.5 Z" />
        </svg>
        <div class="hold-pct" id="hold-pct">0%</div>
      </div>
    </div>

    <!-- Real-Time Waveform + Frequency Spectrum Visualizer -->
    <div class="scope-card">
      <div class="scope-legend">
        <span>Waveform</span>
        <span class="scope-zone-tag" id="zone-label">1.8–4.5 kHz Zone</span>
      </div>
      <canvas id="scope-canvas" width="680" height="240"></canvas>
    </div>

    <!-- Minimal Dynamic Coaching Hint -->
    <div class="status-pill" id="status-pill">Tap Start &amp; whistle to unlock</div>

    <!-- Real-time Pitch & Power Bars -->
    <div class="meters-stack">
      <div class="meter-card">
        <div class="meter-top">
          <span class="meter-label">
            <span>Pitch</span>
            <span class="zone-pill" id="pitch-badge">Whistle Zone</span>
          </span>
          <span class="meter-val" id="pitch-val">0 Hz</span>
        </div>
        <div class="meter-track">
          <div class="pitch-zone-marker" id="pitch-zone-marker"></div>
          <div class="meter-fill" id="pitch-fill"></div>
        </div>
      </div>

      <div class="meter-card">
        <div class="meter-top">
          <span class="meter-label">
            <span>Power</span>
            <span class="zone-pill" id="power-badge">Threshold</span>
          </span>
          <span class="meter-val" id="power-val">0%</span>
        </div>
        <div class="meter-track">
          <div class="power-threshold-marker" id="power-threshold-marker"></div>
          <div class="meter-fill" id="power-fill"></div>
        </div>
      </div>
    </div>

    <!-- 4-Digit Combination Tumblers -->
    <div class="combination-box" id="combination-box">
      <div class="digits-row" id="digits-row">
        <div class="digit-slot">•</div>
        <div class="digit-slot">•</div>
        <div class="digit-slot">•</div>
        <div class="digit-slot">•</div>
      </div>
      <div class="reveal-note" id="reveal-note"></div>
    </div>

    <!-- Primary Controls -->
    <div class="actions-row">
      <button type="button" class="btn-primary" id="start-btn">
        <span id="start-btn-icon">🎙️</span>
        <span id="start-btn-text">Start Listening</span>
      </button>

  <!-- Secret Creator Calibration Drawer (Tap Lock 5x) -->
  <div class="modal-backdrop" id="calib-modal">
    <div class="sheet">
      <div class="sheet-header">
        <div class="sheet-title"><span>⚙️</span> <span>Calibration</span></div>
        <button type="button" class="sheet-close" id="calib-close">✕</button>
      </div>
      <div class="calib-form">
        <div class="calib-row">
          <label for="cfg-code">4-Digit Code</label>
          <input id="cfg-code" type="text" maxlength="4" />
        </div>
        <div class="calib-row">
          <label for="cfg-vol">Peak Threshold (0-255)</label>
          <input id="cfg-vol" type="number" min="60" max="250" />
        </div>
        <div class="calib-row">
          <label for="cfg-minf">Min Freq (Hz)</label>
          <input id="cfg-minf" type="number" step="100" />
        </div>
        <div class="calib-row">
          <label for="cfg-maxf">Max Freq (Hz)</label>
          <input id="cfg-maxf" type="number" step="100" />
        </div>
        <div class="calib-row">
          <label for="cfg-purity">Tonal Purity Ratio</label>
          <input id="cfg-purity" type="number" step="0.5" min="1.2" max="10" />
        </div>
        <div class="calib-row">
          <label for="cfg-hold">Hold Duration (ms)</label>
          <input id="cfg-hold" type="number" step="100" min="300" max="5000" />
        </div>
        <div class="calib-row">
          <label for="cfg-msg">Reveal Note</label>
          <input id="cfg-msg" type="text" style="width: 180px;" />
        </div>
        <div class="calib-actions">
          <button type="button" class="btn-small" id="calib-save">Save</button>
          <button type="button" class="btn-small amber" id="calib-copy-url">Copy Link</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================================
    // 1. CONFIGURATION
    // =========================================================
    const DEFAULT_CONFIG = {
      secretCode: "7246",
      volumeThreshold: 215, // ~85% of 255
      minFreq: 1800,
      maxFreq: 4500,
      purityRatio: 3.5,
      holdTimeMs: 1200,
      message: "Bet settled. Check Locker A. G. Rain!"
    };

    const CONFIG = Object.assign({}, DEFAULT_CONFIG);

    // =========================================================
    // 2. DOM ELEMENTS
    // =========================================================
    const lockCore = document.getElementById("lock-core");
    const holdPctEl = document.getElementById("hold-pct");
    const progressCircle = document.getElementById("progress-circle");
    const statusPill = document.getElementById("status-pill");
    const pitchVal = document.getElementById("pitch-val");
    const powerVal = document.getElementById("power-val");
    const pitchFill = document.getElementById("pitch-fill");
    const powerFill = document.getElementById("power-fill");
    const pitchZoneMarker = document.getElementById("pitch-zone-marker");
    const powerThresholdMarker = document.getElementById("power-threshold-marker");
    const zoneLabel = document.getElementById("zone-label");
    const combinationBox = document.getElementById("combination-box");
    const digitsRow = document.getElementById("digits-row");
    const revealNote = document.getElementById("reveal-note");
    const startBtn = document.getElementById("start-btn");
    const startBtnIcon = document.getElementById("start-btn-icon");
    const startBtnText = document.getElementById("start-btn-text");
    const scopeCanvas = document.getElementById("scope-canvas");
    const sCtx = scopeCanvas.getContext("2d");

    const RING_CIRCUMFERENCE = 2 * Math.PI * 56; // r=56 -> 351.858
    const MAX_DISPLAY_HZ = 6000;

    function updateThresholdUI() {
      const pct = Math.min(98, Math.max(10, (CONFIG.volumeThreshold / 255) * 100));
      powerThresholdMarker.style.left = pct + "%";

      const leftPct = Math.max(0, Math.min(95, (CONFIG.minFreq / MAX_DISPLAY_HZ) * 100));
      const widthPct = Math.max(5, Math.min(100 - leftPct, ((CONFIG.maxFreq - CONFIG.minFreq) / MAX_DISPLAY_HZ) * 100));
      pitchZoneMarker.style.left = leftPct + "%";
      pitchZoneMarker.style.width = widthPct + "%";
      zoneLabel.textContent = (CONFIG.minFreq / 1000).toFixed(1) + "–" + (CONFIG.maxFreq / 1000).toFixed(1) + " kHz Zone";
    }

    function loadConfig() {
      try {
        const raw = localStorage.getItem("whistle_lockbox_cfg");
        if (raw) {
          const saved = JSON.parse(raw);
          Object.assign(CONFIG, saved);
        }
      } catch (e) {}

      const params = new URLSearchParams(window.location.search);
      if (params.get("code")) CONFIG.secretCode = params.get("code").slice(0, 4);
      if (params.get("vol")) CONFIG.volumeThreshold = Number(params.get("vol"));
      if (params.get("min")) CONFIG.minFreq = Number(params.get("min"));
      if (params.get("max")) CONFIG.maxFreq = Number(params.get("max"));
      if (params.get("purity")) CONFIG.purityRatio = Number(params.get("purity"));
      if (params.get("hold")) CONFIG.holdTimeMs = Number(params.get("hold"));
      if (params.get("msg")) CONFIG.message = params.get("msg");

      updateThresholdUI();
    }

    // =========================================================
    // 3. WEB AUDIO API & FFT ACOUSTIC ENGINE
    // =========================================================
    let audioCtx = null;
    let analyser = null;
    let micStream = null;
    let freqData = null;
    let timeData = null;
    let isListening = false;
    let isUnlocked = false;
    let rafId = null;
    let progress = 0; // 0.0 to 1.0
    let lastFrameTime = 0;

    async function toggleListening() {
      if (isUnlocked) return;
      if (isListening) {
        stopAudio();
        setStatus("Paused. Tap Start to listen", "");
        return;
      }

      try {
        setStatus("Requesting microphone...", "");

        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!audioCtx) {
          audioCtx = new AudioContextClass();
        }
        if (audioCtx.state === "suspended") {
          audioCtx.resume();
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus("Microphone API requires HTTPS", "warn");
          return;
        }

        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              echoCancellation: false,
              noiseSuppression: false,
              autoGainControl: false
            }
          });
        } catch (constraintErr) {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        }

        if (audioCtx.state === "suspended") {
          await audioCtx.resume();
        }

        const source = audioCtx.createMediaStreamSource(micStream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.2;
        source.connect(analyser);

        freqData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.fftSize);
        isListening = true;
        lastFrameTime = performance.now();

        startBtn.classList.add("listening");
        startBtnIcon.textContent = "⏹️";
        startBtnText.textContent = "Stop Listening";
        setStatus("Listening... whistle into the mic!", "");

        rafId = requestAnimationFrame(analyzeLoop);
      } catch (err) {
        setStatus("Mic blocked: allow microphone access", "warn");
      }
    }

    function stopAudio() {
      isListening = false;
      document.body.classList.remove("whistling-now");
      if (rafId) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      if (micStream) {
        micStream.getTracks().forEach(function(t) { t.stop(); });
        micStream = null;
      }
      if (audioCtx) {
        audioCtx.close().catch(function() {});
        audioCtx = null;
      }
      startBtn.classList.remove("listening");
      startBtnIcon.textContent = "🎙️";
      startBtnText.textContent = isUnlocked ? "Unlocked" : "Start Listening";
    }

    function analyzeLoop(now) {
      if (!isListening || !analyser) return;
      const dt = Math.min(0.1, Math.max(0.001, (now - lastFrameTime) / 1000));
      lastFrameTime = now;

      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      const sampleRate = audioCtx ? audioCtx.sampleRate : 48000;
      const binCount = analyser.frequencyBinCount; // 1024
      const binHz = sampleRate / analyser.fftSize;

      const minBin = Math.max(1, Math.floor(CONFIG.minFreq / binHz));
      const maxBin = Math.min(binCount - 1, Math.ceil(CONFIG.maxFreq / binHz));
      const displayMaxBin = Math.min(binCount - 1, Math.ceil(MAX_DISPLAY_HZ / binHz));

      let overallPeakVal = 0;
      let overallPeakBin = 0;
      let targetPeakVal = 0;
      let targetPeakBin = minBin;
      let sumSquares = 0;

      for (let i = 2; i <= displayMaxBin; i++) {
        const val = freqData[i];
        sumSquares += val * val;

        if (val > overallPeakVal) {
          overallPeakVal = val;
          overallPeakBin = i;
        }

        if (i >= minBin && i <= maxBin && val > targetPeakVal) {
          targetPeakVal = val;
          targetPeakBin = i;
        }
      }

      let outsideSum = 0;
      let outsideCount = 0;
      const harmonicBin = targetPeakBin * 2;
      for (let i = 2; i <= displayMaxBin; i++) {
        if (Math.abs(i - targetPeakBin) <= 4 || Math.abs(i - harmonicBin) <= 4) continue;
        outsideSum += freqData[i];
        outsideCount++;
      }

      const outsideAvg = outsideCount > 0 ? outsideSum / outsideCount : 1;
      const dominantHz = Math.round(overallPeakBin * binHz);
      const rms = Math.sqrt(sumSquares / displayMaxBin);

      const activePeak = inBand(dominantHz) ? targetPeakVal : overallPeakVal;
      const powerPct = Math.min(100, Math.round((activePeak / 255) * 100));
      const purity = targetPeakVal / Math.max(1, outsideAvg);

      const inFreqBand = inBand(dominantHz);
      const enoughVolume = targetPeakVal >= CONFIG.volumeThreshold;
      const isPureTone = purity >= CONFIG.purityRatio;

      const isValidWhistle = inFreqBand && enoughVolume && isPureTone;

      const fillRate = 1000 / CONFIG.holdTimeMs;
      if (isValidWhistle) {
        progress = Math.min(1, progress + dt * fillRate);
        lockCore.classList.add("active-whistle");
        document.body.classList.add("whistling-now");
      } else {
        progress = Math.max(0, progress - dt * 0.5);
        lockCore.classList.remove("active-whistle");
        document.body.classList.remove("whistling-now");
      }

      updateDashboardUI(dominantHz, overallPeakVal, targetPeakVal, powerPct, inFreqBand, enoughVolume, isPureTone, rms);
      drawScopeAndSpectrum(minBin, maxBin, displayMaxBin, isValidWhistle);

      if (progress >= 1) {
        triggerUnlock();
        return;
      }

      rafId = requestAnimationFrame(analyzeLoop);
    }

    function inBand(hz) {
      return hz >= CONFIG.minFreq && hz <= CONFIG.maxFreq;
    }

    function updateDashboardUI(dominantHz, overallPeakVal, targetPeakVal, powerPct, inFreqBand, enoughVolume, isPureTone, rms) {
      const offset = RING_CIRCUMFERENCE * (1 - progress);
      progressCircle.style.strokeDashoffset = offset.toFixed(1);
      holdPctEl.textContent = Math.round(progress * 100) + "%";

      if (overallPeakVal < 18) {
        pitchVal.textContent = "0 Hz";
        pitchVal.classList.remove("in-zone");
        pitchFill.style.width = "0%";
        pitchFill.classList.remove("active");
      } else {
        pitchVal.textContent = dominantHz + " Hz";
        pitchVal.classList.toggle("in-zone", inFreqBand);
        const pitchPct = Math.min(100, Math.max(2, (dominantHz / MAX_DISPLAY_HZ) * 100));
        pitchFill.style.width = pitchPct + "%";
        pitchFill.classList.toggle("active", inFreqBand);
      }

      powerVal.textContent = powerPct + "%";
      powerFill.style.width = powerPct + "%";
      powerFill.classList.toggle("active", powerPct >= Math.round((CONFIG.volumeThreshold / 255) * 100));

      if (inFreqBand && enoughVolume && isPureTone) {
        setStatus(progress > 0.5 ? "Hold it! Almost there..." : "Nice whistle! Hold that note...", "good");
      } else if (overallPeakVal < 28) {
        setStatus("Listening... whistle into the mic!", "");
      } else if (!isPureTone && rms > 35) {
        if (dominantHz < 900) {
          setStatus("Just air! Fold your tongue tip back...", "warn");
        } else {
          setStatus("Don't scream—make a clean whistle!", "warn");
        }
      } else if (inFreqBand && !enoughVolume) {
        setStatus("Good pitch! Now whistle louder!", "good");
      } else if (dominantHz < CONFIG.minFreq) {
        setStatus("Pitch too low (" + dominantHz + " Hz) — aim higher!", "");
      } else if (dominantHz > CONFIG.maxFreq) {
        setStatus("Pitch too high (" + dominantHz + " Hz)", "");
      }
    }

    function setStatus(text, tone) {
      statusPill.textContent = text;
      statusPill.className = "status-pill" + (tone ? " " + tone : "");
    }

    // =========================================================
    // 4. REAL-TIME WAVEFORM + SPECTRUM CANVAS
    // =========================================================
    function drawScopeAndSpectrum(minBin, maxBin, displayMaxBin, isValidWhistle) {
      const w = scopeCanvas.width;
      const h = scopeCanvas.height;
      sCtx.clearRect(0, 0, w, h);

      // 1. Highlight Target Whistle Zone band (1800 - 4500 Hz)
      const zoneX1 = (CONFIG.minFreq / MAX_DISPLAY_HZ) * w;
      const zoneX2 = (CONFIG.maxFreq / MAX_DISPLAY_HZ) * w;
      sCtx.fillStyle = isValidWhistle ? "rgba(94, 140, 97, 0.20)" : "rgba(94, 140, 97, 0.09)";
      sCtx.fillRect(zoneX1, 0, zoneX2 - zoneX1, h);

      sCtx.strokeStyle = "rgba(94, 140, 97, 0.45)";
      sCtx.setLineDash([5, 5]);
      sCtx.lineWidth = 1.5;
      sCtx.beginPath();
      sCtx.moveTo(zoneX1, 0);
      sCtx.lineTo(zoneX1, h);
      sCtx.moveTo(zoneX2, 0);
      sCtx.lineTo(zoneX2, h);
      sCtx.stroke();
      sCtx.setLineDash([]);

      // 2. Draw Frequency Spectrum Bars along bottom
      const numBars = 52;
      const barWidth = (w / numBars) * 0.68;
      const gap = (w / numBars) * 0.32;

      for (let i = 0; i < numBars; i++) {
        const t = i / numBars;
        const binIdx = Math.max(1, Math.min(displayMaxBin, Math.floor(t * displayMaxBin)));
        const val = freqData ? freqData[binIdx] : 0;
        const norm = val / 255;
        const barH = Math.max(3, norm * (h * 0.76));
        const x = i * (barWidth + gap) + gap / 2;
        const y = h - barH;

        const inZone = binIdx >= minBin && binIdx <= maxBin;
        if (inZone) {
          sCtx.fillStyle = isValidWhistle
            ? "rgba(94, 140, 97, " + (0.55 + norm * 0.45) + ")"
            : "rgba(232, 155, 60, " + (0.45 + norm * 0.55) + ")";
        } else {
          sCtx.fillStyle = "rgba(118, 132, 117, " + (0.22 + norm * 0.4) + ")";
        }
        sCtx.beginPath();
        sCtx.roundRect ? sCtx.roundRect(x, y, barWidth, barH, 3) : sCtx.rect(x, y, barWidth, barH);
        sCtx.fill();
      }

      // 3. Draw Live Time-Domain Oscilloscope Waveform across the center
      sCtx.beginPath();
      sCtx.lineWidth = 3.2;
      sCtx.lineCap = "round";
      sCtx.lineJoin = "round";
      sCtx.strokeStyle = isValidWhistle ? "#467349" : "#3148d8";

      if (timeData && isListening) {
        const sliceWidth = w / 256;
        let x = 0;
        for (let i = 0; i < 256; i++) {
          const v = timeData[i * 4] / 128.0;
          const y = (v * h) / 2;
          if (i === 0) sCtx.moveTo(x, y);
          else sCtx.lineTo(x, y);
          x += sliceWidth;
        }
      } else {
        sCtx.strokeStyle = "rgba(118, 132, 117, 0.35)";
        sCtx.moveTo(0, h / 2);
        sCtx.lineTo(w, h / 2);
      }
      sCtx.stroke();
    }

    // =========================================================
    // 5. UNLOCK REVEAL & CONFETTI
    // =========================================================
    function triggerUnlock() {
      isUnlocked = true;
      stopAudio();
      document.body.classList.add("whistling-now");

      progress = 1;
      progressCircle.style.strokeDashoffset = "0";
      lockCore.classList.remove("active-whistle");
      lockCore.classList.add("unlocked");
      holdPctEl.textContent = "OPEN";

      setStatus("Unlocked! Here is your combination:", "good");
      startBtn.style.display = "none";

      combinationBox.classList.add("unlocked");
      revealNote.textContent = CONFIG.message;

      const codeChars = String(CONFIG.secretCode).padStart(4, "0").slice(0, 4).split("");
      const slots = digitsRow.querySelectorAll(".digit-slot");

      slots.forEach(function(slot, idx) {
        let ticks = 0;
        const maxTicks = 8 + idx * 4;
        const timer = setInterval(function() {
          ticks++;
          if (ticks >= maxTicks) {
            clearInterval(timer);
            slot.textContent = codeChars[idx];
          } else {
            slot.textContent = Math.floor(Math.random() * 10);
          }
        }, 45);
      });

      launchConfetti();
    }

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ["#5e8c61", "#a3c999", "#e89b3c", "#3148d8", "#861619"];
      const pieces = Array.from({ length: 85 }, function() {
        return {
          x: canvas.width / 2 + (Math.random() - 0.5) * 80,
          y: canvas.height * 0.3,
          vx: (Math.random() - 0.5) * 13,
          vy: -Math.random() * 13 - 4,
          size: Math.random() * 7 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.25
        };
      });

      let frame = 0;
      function tick() {
        frame++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;
        for (let i = 0; i < pieces.length; i++) {
          const p = pieces[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.36;
          p.vx *= 0.99;
          p.rot += p.vRot;
          if (p.y < canvas.height + 20) alive = true;

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        }
        if (alive && frame < 240) requestAnimationFrame(tick);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      requestAnimationFrame(tick);
    }

    // =========================================================
    // 6. INIT & EVENT LISTENERS
    // =========================================================
    loadConfig();
    drawScopeAndSpectrum(75, 190, 256, false);

    startBtn.addEventListener("click", toggleListening);

    let tapCount = 0;
    let tapTimer = null;
    const calibModal = document.getElementById("calib-modal");

    lockCore.addEventListener("click", function() {
      tapCount++;
      clearTimeout(tapTimer);
      if (tapCount >= 5) {
        tapCount = 0;
        openCalibrationDrawer();
      } else {
        tapTimer = setTimeout(function() { tapCount = 0; }, 1200);
      }
    });

    function openCalibrationDrawer() {
      document.getElementById("cfg-code").value = CONFIG.secretCode;
      document.getElementById("cfg-vol").value = CONFIG.volumeThreshold;
      document.getElementById("cfg-minf").value = CONFIG.minFreq;
      document.getElementById("cfg-maxf").value = CONFIG.maxFreq;
      document.getElementById("cfg-purity").value = CONFIG.purityRatio;
      document.getElementById("cfg-hold").value = CONFIG.holdTimeMs;
      document.getElementById("cfg-msg").value = CONFIG.message;
      calibModal.classList.add("open");
    }

    function readCalibInputs() {
      CONFIG.secretCode = (document.getElementById("cfg-code").value || "7246").slice(0, 4);
      CONFIG.volumeThreshold = Number(document.getElementById("cfg-vol").value) || 215;
      CONFIG.minFreq = Number(document.getElementById("cfg-minf").value) || 1800;
      CONFIG.maxFreq = Number(document.getElementById("cfg-maxf").value) || 4500;
      CONFIG.purityRatio = Number(document.getElementById("cfg-purity").value) || 3.5;
      CONFIG.holdTimeMs = Number(document.getElementById("cfg-hold").value) || 1200;
      CONFIG.message = document.getElementById("cfg-msg").value || DEFAULT_CONFIG.message;
      updateThresholdUI();
    }

    document.getElementById("calib-close").addEventListener("click", function() {
      calibModal.classList.remove("open");
    });

    document.getElementById("calib-save").addEventListener("click", function() {
      readCalibInputs();
      try {
        localStorage.setItem("whistle_lockbox_cfg", JSON.stringify(CONFIG));
      } catch (e) {}
      calibModal.classList.remove("open");
      setStatus("Saved locally", "good");
    });

    document.getElementById("calib-copy-url").addEventListener("click", async function() {
      readCalibInputs();
      const url = new URL(window.location.origin + window.location.pathname);
      url.searchParams.set("code", CONFIG.secretCode);
      url.searchParams.set("vol", CONFIG.volumeThreshold);
      url.searchParams.set("min", CONFIG.minFreq);
      url.searchParams.set("max", CONFIG.maxFreq);
      url.searchParams.set("purity", CONFIG.purityRatio);
      url.searchParams.set("hold", CONFIG.holdTimeMs);
      if (CONFIG.message !== DEFAULT_CONFIG.message) {
        url.searchParams.set("msg", CONFIG.message);
      }
      try {
        await navigator.clipboard.writeText(url.toString());
        setStatus("Link copied to clipboard!", "good");
      } catch (e) {
        window.history.replaceState({}, "", url.toString());
        setStatus("URL updated in address bar!", "good");
      }
      calibModal.classList.remove("open");
    });
  </script>
</body>
